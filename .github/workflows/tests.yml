name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: [8.3, 8.4, 8.5]

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Build frontend assets
        run: npm ci && npm run build

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Execute tests
        run: php artisan test

      - name: Install Playwright Chromium
        if: matrix.php == '8.5'
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        if: matrix.php == '8.5'
        run: |
          mkdir -p storage/framework/testing
          fixture="$(mktemp -d "$PWD/storage/framework/testing/browser-smoke-XXXXXX")"
          mkdir -p "$fixture"/{private,cache,locks,sessions,views,framework}
          touch "$fixture/database.sqlite"
          export LARAVEL_STORAGE_PATH="$fixture"
          export APP_CONFIG_CACHE="${fixture#"$PWD"/}/config.php"
          php tests/Browser/fixture.php prepare "$fixture" http://127.0.0.1:8765
          php tests/Browser/fixture.php seed-parallel "$fixture" 0
          npx playwright test
